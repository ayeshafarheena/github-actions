name: Create AWS EC2 & S3

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  INSTANCE_TYPE: t2.medium
  S3_BUCKET_NAME: gitaction-s3-ec2-0875
  INSTANCE_NAME: git
  ENVIRONMENT: dev

jobs:
  create-s3-bucket:
    name: 🪣 Create S3 Bucket
    runs-on: ubuntu-latest

    outputs:
      bucket_name: ${{ steps.create_bucket.outputs.bucket_name }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create S3 Bucket
        id: create_bucket
        run: |
          BUCKET_NAME="gitaction-s3-ec2-0875"
          REGION="us-east-1"

          echo "Creating S3 bucket: $BUCKET_NAME in $REGION"

          aws s3api create-bucket \
            --bucket "$BUCKET_NAME" \
            --region "$REGION"

          # Block all public access
          aws s3api put-public-access-block \
            --bucket "$BUCKET_NAME" \
            --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

          # Enable versioning
          aws s3api put-bucket-versioning \
            --bucket "$BUCKET_NAME" \
            --versioning-configuration Status=Enabled

          # Enable server-side encryption
          aws s3api put-bucket-encryption \
            --bucket "$BUCKET_NAME" \
            --server-side-encryption-configuration '{
              "Rules": [{
                "ApplyServerSideEncryptionByDefault": {
                  "SSEAlgorithm": "AES256"
                }
              }]
            }'

          # Tag the bucket
          aws s3api put-bucket-tagging \
            --bucket "$BUCKET_NAME" \
            --tagging "TagSet=[
              {Key=Environment,Value=dev},
              {Key=CreatedBy,Value=github-actions},
              {Key=Repository,Value=${{ github.repository }}}
            ]"

          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "✅ S3 Bucket '$BUCKET_NAME' created successfully!"

  create-ec2-instance:
    name: 🖥️ Create EC2 Instance
    runs-on: ubuntu-latest
    needs: create-s3-bucket

    outputs:
      instance_id: ${{ steps.launch_ec2.outputs.instance_id }}
      public_ip: ${{ steps.get_ip.outputs.public_ip }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get Latest Amazon Linux 2023 AMI
        id: get_ami
        run: |
          AMI_ID=$(aws ssm get-parameter \
            --name "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64" \
            --query "Parameter.Value" \
            --output text)
          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo "Using AMI: $AMI_ID"

      - name: Create Security Group
        id: create_sg
        run: |
          SG_NAME="git-sg-${{ github.run_id }}"

          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=isDefault,Values=true" \
            --query "Vpcs[0].VpcId" \
            --output text)

          echo "Using VPC: $VPC_ID"

          SG_ID=$(aws ec2 create-security-group \
            --group-name "$SG_NAME" \
            --description "Created by GitHub Actions run ${{ github.run_id }}" \
            --vpc-id "$VPC_ID" \
            --query "GroupId" \
            --output text)

          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr 0.0.0.0/0

          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 80 \
            --cidr 0.0.0.0/0

          aws ec2 create-tags \
            --resources "$SG_ID" \
            --tags Key=Name,Value="$SG_NAME" Key=Environment,Value=dev Key=CreatedBy,Value=github-actions

          echo "sg_id=$SG_ID" >> $GITHUB_OUTPUT
          echo "✅ Security Group '$SG_ID' created."

      - name: Launch EC2 Instance
        id: launch_ec2
        run: |
          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id "${{ steps.get_ami.outputs.ami_id }}" \
            --instance-type "t2.medium" \
            --security-group-ids "${{ steps.create_sg.outputs.sg_id }}" \
            --tag-specifications "ResourceType=instance,Tags=[
              {Key=Name,Value=git},
              {Key=Environment,Value=dev},
              {Key=CreatedBy,Value=github-actions},
              {Key=Repository,Value=${{ github.repository }}}
            ]" \
            --metadata-options "HttpTokens=required,HttpEndpoint=enabled" \
            --block-device-mappings '[{
              "DeviceName": "/dev/xvda",
              "Ebs": {
                "VolumeSize": 20,
                "VolumeType": "gp3",
                "DeleteOnTermination": true,
                "Encrypted": true
              }
            }]' \
            --query "Instances[0].InstanceId" \
            --output text)

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "✅ EC2 Instance '$INSTANCE_ID' launched!"

      - name: Wait for EC2 to be Running
        run: |
          echo "Waiting for instance to reach 'running' state..."
          aws ec2 wait instance-running \
            --instance-ids "${{ steps.launch_ec2.outputs.instance_id }}"
          echo "✅ Instance is running!"

      - name: Get Public IP
        id: get_ip
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "${{ steps.launch_ec2.outputs.instance_id }}" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "Public IP: $PUBLIC_IP"

  summary:
    name: 📋 Deployment Summary
    runs-on: ubuntu-latest
    needs: [create-s3-bucket, create-ec2-instance]
    if: always()

    steps:
      - name: Print Summary
        run: |
          echo "## ✅ AWS Resources Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| **S3 Bucket** | \`gitaction-s3-ec2-0875\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **EC2 Instance Name** | \`git\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **EC2 Instance ID** | \`${{ needs.create-ec2-instance.outputs.instance_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **EC2 Public IP** | \`${{ needs.create-ec2-instance.outputs.public_ip }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Instance Type** | \`t2.medium\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Region** | \`us-east-1\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`dev\` |" >> $GITHUB_STEP_SUMMARY
